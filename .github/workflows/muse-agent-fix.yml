name: Muse Agent Fix (label-gated)

# Gate 2 of the Relais two-gate workflow: nothing runs until a human
# developer adds the `agent-fix` label to an issue. The resulting PR
# still requires human review before merging.
on:
  issues:
    types: [labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  muse-fix:
    if: github.event.label.name == 'agent-fix'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Draft fix with Meta Muse and open PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          MODEL_NAME: muse-spark-1.3
          MODEL_BASE_URL: https://api.meta.ai/v1
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO: ${{ github.repository }}
        run: node .github/scripts/muse-fix.mjs
